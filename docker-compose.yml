services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: saobeo_lead
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - saobeo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saobeo_lead"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saobeo_pgdata:
